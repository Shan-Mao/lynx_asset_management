name: lynx_asset_management
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.0
  path_provider: ^2.1.0
  intl: ^0.20.2
  uuid: ^4.0.0
  file_picker: ^11.0.2
  share_plus: ^12.0.2
  # Pinned to 1.x: dynamic_color 2.x depends on the `material_ui` package and
  # its ColorScheme is incompatible with package:flutter/material.dart.
  dynamic_color: 1.7.0
  # CorePalette comes from here; it is only a transitive dependency of
  # dynamic_color, so declare it explicitly.
  material_color_utilities: ^0.13.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
